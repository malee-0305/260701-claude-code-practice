<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주요 금융지표 대시보드</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    header {
      background: #1a365d;
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; flex: 1; }

    .date-form {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .date-form input[type="date"] {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .date-form button {
      padding: 9px 22px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .date-form button:hover:not(:disabled) { background: #3182ce; }
    .date-form button:disabled { background: #a0aec0; cursor: not-allowed; }

    #spinner {
      display: none;
      color: #90cdf4;
      font-size: 0.9rem;
      align-items: center;
      gap: 8px;
    }

    #spinner.active { display: flex; }

    .spin {
      width: 18px; height: 18px;
      border: 3px solid #90cdf4;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    #welcome {
      text-align: center;
      padding: 80px 20px;
      color: #718096;
    }

    #welcome svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }
    #welcome p  { font-size: 1.05rem; }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .card.wide { grid-column: 1 / -1; }

    .card-header {
      padding: 14px 20px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .card-header.blue   { background: #2b6cb0; }
    .card-header.green  { background: #276749; }
    .card-header.purple { background: #553c9a; }
    .card-header.orange { background: #c05621; }
    .card-header.teal   { background: #285e61; }

    .card-body { padding: 16px 20px; overflow-x: auto; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: auto;
    }

    .badge-ok  { background: #c6f6d5; color: #22543d; }
    .badge-err { background: #fed7d7; color: #742a2a; }
    .badge-loading { background: #bee3f8; color: #2a4365; }

    .error-box {
      padding: 12px;
      background: #fff5f5;
      border-left: 4px solid #fc8181;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #742a2a;
      white-space: pre-wrap;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    table.data-table th,
    table.data-table td {
      padding: 7px 12px;
      text-align: right;
      border-bottom: 1px solid #edf2f7;
      white-space: nowrap;
    }

    table.data-table th { font-weight: 700; background: #f7fafc; text-align: center; }

    table.data-table td:first-child,
    table.data-table th:first-child { text-align: left; }

    table.data-table tr:hover td { background: #ebf8ff; }

    .note { font-size: 0.78rem; color: #718096; margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <h1>📊 주요 금융지표 대시보드</h1>
  <div class="date-form">
    <input type="date" id="dateInput" value="">
    <button id="fetchBtn" onclick="fetchData()">조회</button>
    <div id="spinner"><div class="spin"></div> 데이터 수집 중...</div>
  </div>
</header>

<main>
  <div id="welcome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
    </svg>
    <p>날짜를 선택하고 <strong>조회</strong> 버튼을 클릭하세요.</p>
    <p class="note" style="margin-top:8px">KRX · 채권정보센터 · 콜금리 · 환율 · Investing.com 데이터를 수집합니다.</p>
  </div>

  <div id="dashboard" style="display:none">
    <div class="grid">

      <!-- KRX -->
      <div class="card wide">
        <div class="card-header blue">
          🏦 KRX 시가총액 &amp; 거래대금
          <span id="krx-badge" class="status-badge badge-loading">대기</span>
        </div>
        <div class="card-body" id="krx-body"></div>
      </div>

      <!-- 채권정보센터 -->
      <div class="card">
        <div class="card-header green">
          📈 채권수익률 (채권정보센터)
          <span id="bond-badge" class="status-badge badge-loading">대기</span>
        </div>
        <div class="card-body" id="bond-body"></div>
      </div>

      <!-- 환율 -->
      <div class="card">
        <div class="card-header orange">
          💱 환율 (SMBS 기준환율)
          <span id="fx-badge" class="status-badge badge-loading">대기</span>
        </div>
        <div class="card-body" id="fx-body"></div>
      </div>

      <!-- 콜금리 -->
      <div class="card">
        <div class="card-header purple">
          🏛 콜금리 (한국은행 ECOS)
          <span id="call-badge" class="status-badge badge-loading">대기</span>
        </div>
        <div class="card-body" id="call-body"></div>
      </div>

      <!-- Investing.com -->
      <div class="card wide">
        <div class="card-header teal">
          🌐 글로벌 지수 &amp; 원자재 (Investing.com)
          <span id="investing-badge" class="status-badge badge-loading">대기</span>
        </div>
        <div class="card-body" id="investing-body"></div>
      </div>

    </div>
  </div>
</main>

<script>
  // 오늘 날짜 기본값
  const today = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('dateInput').value =
    `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  function setSection(key, html, err) {
    const body  = document.getElementById(`${key}-body`);
    const badge = document.getElementById(`${key}-badge`);
    if (err) {
      body.innerHTML  = `<div class="error-box">${err}</div>`;
      badge.className = 'status-badge badge-err';
      badge.textContent = '오류';
    } else {
      body.innerHTML  = html;
      badge.className = 'status-badge badge-ok';
      badge.textContent = '완료';
    }
  }

  async function fetchData() {
    const dateVal = document.getElementById('dateInput').value;
    if (!dateVal) { alert('날짜를 선택해주세요.'); return; }

    document.getElementById('welcome').style.display   = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('fetchBtn').disabled       = true;
    document.getElementById('spinner').classList.add('active');

    // 뱃지 초기화
    ['krx','bond','fx','call','investing'].forEach(k => {
      document.getElementById(`${k}-body`).innerHTML = '<p class="note">수집 중...</p>';
      const b = document.getElementById(`${k}-badge`);
      b.className   = 'status-badge badge-loading';
      b.textContent = '수집 중';
    });

    try {
      const resp = await fetch('/api/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: dateVal })
      });
      const data = await resp.json();

      const r = data.results || {};
      const e = data.errors  || {};

      setSection('krx',       r.krx       || '', e.krx       || (!r.krx ? '데이터 없음' : null));
      setSection('bond',      r.bond      || '', e.bond      || (!r.bond ? '데이터 없음' : null));
      setSection('fx',        r.fx        || '', e.fx        || (!r.fx ? '데이터 없음' : null));
      setSection('call',      r.call      || '', e.call      || (!r.call ? '데이터 없음' : null));
      setSection('investing', r.investing || '', e.investing || (!r.investing ? '데이터 없음' : null));

      if (r.krx_date && r.krx_date !== data.date) {
        document.getElementById('krx-body').insertAdjacentHTML(
          'beforeend',
          `<p class="note">* 휴장일로 인해 ${r.krx_date} 기준 데이터 표시</p>`
        );
      }
    } catch(err) {
      alert('오류: ' + err.message);
    } finally {
      document.getElementById('fetchBtn').disabled = false;
      document.getElementById('spinner').classList.remove('active');
    }
  }

  document.getElementById('dateInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchData();
  });
</script>
</body>
</html>
